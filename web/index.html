<!DOCTYPE html>
<html lang="es" class="h-full dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SIGEM · Equipos Biomédicos</title>
  <!--
    SIGEM_V5 — shell de DESARROLLO. Carga las dependencias por CDN y las fuentes
    por separado para iterar rápido (abrir web/index.html con un servidor estático).
    El build (tools/build.js) inlina TODO en dist/Index.html para pegar en Apps Script.
    Marcadores SIGEM:* los usa el build para inyectar el contenido inline.
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: {
          // Identidad "Centro de control": grafito/navy + cian + lima
          brand: { DEFAULT: '#22d3ee', 2: '#0891b2', 3: '#67e8f9', dk: '#22d3ee', ink: '#04212b' },
          lime:  { DEFAULT: '#a3e635', dk: '#bef264' },
          ink:   { 900: '#0b1220', 800: '#0f1729', 700: '#141d30', 600: '#1b2740', line: '#22304d' },
          op:    { DEFAULT: '#22c55e', soft: '#0f2a1a', dk: '#4ade80' },
          noop:  { DEFAULT: '#f43f5e', soft: '#2a0f17', dk: '#fb7185' },
          st:    { DEFAULT: '#f59e0b', soft: '#2a1f08', dk: '#fbbf24' },
          baja:  { DEFAULT: '#64748b', soft: '#1a2233', dk: '#94a3b8' },
          desc:  { DEFAULT: '#64748b', soft: '#1a2233', dk: '#94a3b8' }
        },
        borderRadius: { md: '6px', lg: '8px', xl: '11px', '2xl': '14px' },
        boxShadow: { soft: '0 1px 2px rgba(0,0,0,.4)', lift: '0 8px 30px -8px rgba(0,0,0,.6)', glow: '0 0 0 1px rgba(34,211,238,.25), 0 0 24px -6px rgba(34,211,238,.45)' },
        fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] }
      } }
    };
  </script>
  <style>
    html, body, #root { height: 100%; }
    body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-size: 13px; line-height: 1.45; }
    .dark body { background: #0b1220; }
    .mono { font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; letter-spacing: -.2px; }
    .brand-gradient { background-image: linear-gradient(120deg, #0891b2 0%, #06b6d4 55%, #22d3ee 100%); }
    .scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(120,140,170,.30); border-radius: 8px; }
    [data-drawer], [data-overlay] { transition: transform .18s cubic-bezier(.2,.8,.2,1), opacity .18s ease; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
  <!-- SIGEM:STYLE -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
  <div id="root"></div>

  <!-- SIGEM:SEED -->
  <script src="../src/data/seed.clean.js"></script>
  <!-- SIGEM:CORE -->
  <script src="../src/core/hhha-core.js"></script>
  <!-- SIGEM:APP -->
  <script src="./js/app.js"></script>
</body>
</html>
