<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SIGEM · Equipos Biomédicos</title>
  <!--
    SIGEM_V5 — shell de DESARROLLO. Carga las dependencias por CDN y las fuentes
    por separado para iterar rápido (abrir web/index.html con un servidor estático).
    El build (tools/build.js) inlina TODO en dist/Index.html para pegar en Apps Script.
    Marcadores SIGEM:* los usa el build para inyectar el contenido inline.
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: {
          // Identidad propia SIGEM_V5: teal/esmeralda "clínico" + acento cálido
          brand: { DEFAULT: '#0d9488', 2: '#0f766e', 3: '#14b8a6', dk: '#2dd4bf', ink: '#042f2e' },
          accent:{ DEFAULT: '#f59e0b', dk: '#fbbf24' },
          op:    { DEFAULT: '#0f9d6b', soft: '#e6f6ef', dk: '#2bbd83' },
          noop:  { DEFAULT: '#e0334b', soft: '#fdecef', dk: '#f1647c' },
          st:    { DEFAULT: '#d98613', soft: '#fcf2e3', dk: '#e6a23c' },
          baja:  { DEFAULT: '#6b7280', soft: '#eef0f2', dk: '#8b94a0' },
          desc:  { DEFAULT: '#8a93a0', soft: '#eef1f4', dk: '#79828e' }
        },
        borderRadius: { md: '10px', lg: '14px', xl: '18px', '2xl': '24px' },
        boxShadow: { soft: '0 1px 2px rgba(13,148,136,.04), 0 6px 24px -8px rgba(15,23,42,.12)', lift: '0 10px 40px -12px rgba(13,148,136,.30)' },
        fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] }
      } }
    };
  </script>
  <style>
    html, body, #root { height: 100%; }
    body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-size: 14px; line-height: 1.5; }
    .mono { font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; letter-spacing: -.2px; }
    .brand-gradient { background-image: linear-gradient(120deg, #0d9488 0%, #0f766e 55%, #115e59 100%); }
    .scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(120,120,120,.35); border-radius: 8px; }
    [data-drawer], [data-overlay] { transition: transform .2s cubic-bezier(.2,.8,.2,1), opacity .2s ease; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
  <!-- SIGEM:STYLE -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
  <div id="root"></div>

  <!-- SIGEM:SEED -->
  <script src="../src/data/seed.clean.js"></script>
  <!-- SIGEM:CORE -->
  <script src="../src/core/hhha-core.js"></script>
  <!-- SIGEM:APP -->
  <script src="./js/app.js"></script>
</body>
</html>
