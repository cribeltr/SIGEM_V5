<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SIGEM · Equipos Biomédicos</title>
  <!--
    SIGEM_V5 — shell de DESARROLLO. Carga las dependencias por CDN y las fuentes
    por separado para iterar rápido (abrir web/index.html con un servidor estático).
    El build (tools/build.js) inlina TODO en dist/Index.html para pegar en Apps Script.
    Marcadores SIGEM:* los usa el build para inyectar el contenido inline.
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: {
          // Paleta "densa pro" del SIGEM original (acento índigo + estados exactos)
          brand: { DEFAULT: '#4f46e5', 2: '#6366f1', dk: '#7c7bf6' },
          op:    { DEFAULT: '#0f9d6b', soft: '#e6f6ef', dk: '#2bbd83' },
          noop:  { DEFAULT: '#e0334b', soft: '#fdecef', dk: '#f1647c' },
          st:    { DEFAULT: '#d98613', soft: '#fcf2e3', dk: '#e6a23c' },
          baja:  { DEFAULT: '#6b7280', soft: '#eef0f2', dk: '#8b94a0' },
          desc:  { DEFAULT: '#8a93a0', soft: '#eef1f4', dk: '#79828e' }
        },
        borderRadius: { lg: '7px', xl: '9px', md: '5px' },
        fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] }
      } }
    };
  </script>
  <style>
    html, body, #root { height: 100%; }
    body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-size: 13px; line-height: 1.45; }
    .mono { font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; letter-spacing: -.2px; }
    .scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(120,120,120,.35); border-radius: 8px; }
    [data-drawer], [data-overlay] { transition: transform .18s ease, opacity .18s ease; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
  <!-- SIGEM:STYLE -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
  <div id="root"></div>

  <!-- SIGEM:SEED -->
  <script src="../src/data/seed.clean.js"></script>
  <!-- SIGEM:CORE -->
  <script src="../src/core/hhha-core.js"></script>
  <!-- SIGEM:APP -->
  <script src="./js/app.js"></script>
</body>
</html>
